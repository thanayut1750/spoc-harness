services:
  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_USER: spoc
      POSTGRES_PASSWORD: ${SPOC_POSTGRES_PASSWORD:-spoc}
      POSTGRES_DB: spoc
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spoc -d spoc"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  postgres-data:
