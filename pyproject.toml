[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spoc-harness"
version = "0.1.0"
description = "Strategic Pyramid and Organization Chart agent harness with a live 2D office"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "langchain[mcp]>=1.4.6,<2",
  "langchain-core>=1.6.12,<2",
  "langgraph>=1.2.16,<2",
  "langgraph-checkpoint-postgres>=3.2,<4",
  "langsmith>=0.14.11,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "python-dotenv>=1,<2",
  "openai>=2,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "httpx>=0.28,<1",
  "typer>=0.15,<1",
]

[project.scripts]
spoc = "org_harness.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1", "mypy>=1.15,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/org_harness"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires a local Postgres instance", "live: calls configured model and MCP providers"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
